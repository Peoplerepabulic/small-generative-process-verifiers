# GRPO smoke-test pilot for Kaggle T4 (no vLLM). Validates that the reward
# loop runs and r_agree/r_cal move -- NOT a real training run.
# Run at most ~50 steps; watch the reward curves, then stop.
model: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
output_dir: outputs/grpo-pilot
seed: 0

data:
  train_paths:
    - data/mathshepherd_unified.jsonl   # small + mixed labels; fastest signal
  inject_error_prob: 0.0

rewards:
  incorrect_weight: 2.0
  w_agree: 1.0
  w_localize: 0.5
  w_cal: 1.0
  w_format: 0.5   # higher here: format must be learned first on short runs

training:
  num_generations: 2
  max_completion_length: 256
  max_prompt_length: 1024
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-6
  num_train_epochs: 1
  use_vllm: false
  logging_steps: 1
  save_steps: 50
  report_to: none
