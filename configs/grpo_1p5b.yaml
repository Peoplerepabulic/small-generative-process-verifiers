# GRPO training of the generative verifier (Part A). Needs ~48GB VRAM (A6000).
model: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
output_dir: outputs/grpo-1p5b
seed: 0

data:
  train_paths:
    - data/prm800k_unified.jsonl        # phase1/2 train splits
    - data/mathshepherd_unified.jsonl
  # PRM800K chosen paths are ~always all-correct; inject a -1 candidate at one
  # step with this probability to create verifiable first-error examples.
  inject_error_prob: 0.5

rewards:
  # incorrect_weight: measured correct:incorrect on PRM800K phase1_train is
  # 29,016 : 19,656 (~1.5:1) when keeping ALL completions, so no extreme
  # weighting is needed. (The proposal's 92:8 figure refers to ThinkPRM's
  # synthetic chains, not this data -- re-measure if you change data mix.)
  incorrect_weight: 2.0
  w_agree: 1.0
  w_localize: 0.5
  w_cal: 1.0
  w_format: 0.2      # shaping; anneal to 0 after the format is learned

training:
  num_generations: 8
  max_completion_length: 2048   # pilot; full runs use 8192 (needs more VRAM)
  max_prompt_length: 2048
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-6
  num_train_epochs: 1
  use_vllm: true
  vllm_gpu_memory_utilization: 0.4
  logging_steps: 10
  save_steps: 200
  report_to: none   # set to wandb when ready
